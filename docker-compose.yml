          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  aider-service:
    init: true # reap reparented tmux/CLI children (see claudecode-service)
    build:
      context: .
      dockerfile: runner-service/Dockerfile
      args:
        RUNNER_CLI_CACHE_BUST: ${RUNNER_CLI_CACHE_BUST:-2026-09-29}
        AIDER_CLI_VERSION: ${AIDER_CLI_VERSION:-latest}
        AIDER_CLI_CACHE_BUST: ${AIDER_CLI_CACHE_BUST:-1}
    environment:
      - RUNNER_TYPE=aider
      - TZ=${TZ:-Europe/Paris}
      - LOG_LEVEL=info
      - RUNNER_MODEL=${AIDER_MODEL:-}
      # Fallback provider keys — the per-agent LLM config forwarded via
      # X-LLM-Config takes precedence; aider (litellm) reads these env vars when
      # an agent has no explicit config.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-}
      - OPENAI_REALTIME_VOICE=${OPENAI_REALTIME_VOICE:-alloy}
      - OPENAI_REALTIME_TRANSCRIBE_MODEL=${OPENAI_REALTIME_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-}
      - GEMINI_LIVE_VOICE=${GEMINI_LIVE_VOICE:-Kore}
      - TIMEOUT=600
      - PORT=8000
      - HOST=0.0.0.0
      - CODER_API_KEY=${CODER_API_KEY:?CODER_API_KEY must be set in .env (openssl rand -hex 32)}
      - PUID=${CODER_PUID:-1000}
      - PGID=${CODER_PGID:-1000}
      - SWARM_API_BASE_URL=http://api:3001
