      - RUNNER_MODEL=${HERMES_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TIMEOUT=600
      - PORT=8000
      - HOST=0.0.0.0
      - CODER_API_KEY=${CODER_API_KEY:?CODER_API_KEY must be set in .env (openssl rand -hex 32)}
      - PUID=${CODER_PUID:-1000}
      - PGID=${CODER_PGID:-1000}
      - SWARM_API_BASE_URL=http://api:3001
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PYTHONUNBUFFERED=1
    # Stateless runner — /app/data re-injected at spawn (see claudecode-service).
    volumes:
      - rust-toolchain:/opt/rust
      - android-toolchain:/opt/android
    # Disk write ceiling, enforced per node by the io-limiter service
    # (Swarm ignores blkio_config): a runner's builds/installs must not
    # starve the disk shared with Postgres and the other services.
    labels:
      - 'io.pulsarteam.io-limit.write-bps=${RUNNER_IO_WRITE_BPS:-25M}'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512M,mode=1777
    networks:
      - sandbox-net
      # Reach local LLM servers (vLLM/Ollama) by service name. See the llm-net
      # note in the networks: block at the bottom of this file.
      - llm-net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  sandbox-service:
    init: true # reap reparented tmux/CLI children (see claudecode-service)
    build:
      context: .
      dockerfile: runner-service/Dockerfile
      args:
        RUNNER_CLI_CACHE_BUST: ${RUNNER_CLI_CACHE_BUST:-2026-09-29}
    environment:
      - RUNNER_TYPE=sandbox
      - TZ=${TZ:-Europe/Paris}
      - LOG_LEVEL=info
      - TIMEOUT=600
      - PORT=8000
      - HOST=0.0.0.0
      - CODER_API_KEY=${CODER_API_KEY:?CODER_API_KEY must be set in .env (openssl rand -hex 32)}
      - PUID=${CODER_PUID:-1000}
      - PGID=${CODER_PGID:-1000}
      - PYTHONUNBUFFERED=1
    volumes:
      - sandbox-data:/app/data
      - rust-toolchain:/opt/rust
      - android-toolchain:/opt/android
    # Disk write ceiling, enforced per node by the io-limiter service
    # (Swarm ignores blkio_config): a runner's builds/installs must not
    # starve the disk shared with Postgres and the other services.
    labels:
      - 'io.pulsarteam.io-limit.write-bps=${RUNNER_IO_WRITE_BPS:-25M}'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512M,mode=1777
    networks:
      - sandbox-net
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mock-service:
    init: true # reap reparented tmux/CLI children (see claudecode-service)
    build:
      context: .
      dockerfile: runner-service/Dockerfile
      args:
        RUNNER_CLI_CACHE_BUST: ${RUNNER_CLI_CACHE_BUST:-2026-09-29}
    environment:
      - RUNNER_TYPE=mock
      - TZ=${TZ:-Europe/Paris}
      - RUNNER_MODEL=mock-llm-1
      - TIMEOUT=600
      - PORT=8000
      - HOST=0.0.0.0
      - CODER_API_KEY=${CODER_API_KEY:?CODER_API_KEY must be set in .env (openssl rand -hex 32)}
      - PUID=${CODER_PUID:-1000}
      - PGID=${CODER_PGID:-1000}
      - MOCK_DELAY_MS=${MOCK_DELAY_MS:-50}
      - MOCK_FAIL_ON=${MOCK_FAIL_ON:-}
      - MOCK_TIMEOUT_ON=${MOCK_TIMEOUT_ON:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - mock-data:/app/data
    # Disk write ceiling, enforced per node by the io-limiter service
    # (Swarm ignores blkio_config): a runner's builds/installs must not
    # starve the disk shared with Postgres and the other services.
    labels:
      - 'io.pulsarteam.io-limit.write-bps=${RUNNER_IO_WRITE_BPS:-25M}'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128M,mode=1777
    ports:
      - '8010:8000'
    networks:
      - sandbox-net
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Europe/Paris}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128M,mode=1777
    networks:
      - sandbox-net
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8191/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mcp-browser:
    build:
      context: .
      dockerfile: mcp-browser/Dockerfile
    environment:
      - TZ=${TZ:-Europe/Paris}
      - NODE_ENV=production
      - LOG_LEVEL=info
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - MAX_SEARCH_RESULT=5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M,mode=1777
    networks:
      - sandbox-net
      - backend
    depends_on:
      - flaresolverr
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # office-service — office-engine MCP (read/edit/generate/convert DOCX/XLSX/PPTX/PDF)
  # for cloud-connector / uploaded files. The desktop app bundles the SAME engine
  # as a sidecar for local-folder files. On sandbox-net so `api` reaches it by name
  # (http://office-service:8000), like mcp-browser.
  office-service:
    build:
      context: .
      dockerfile: office-service/Dockerfile
    environment:
      - TZ=${TZ:-Europe/Paris}
      - OFFICE_HOST=0.0.0.0
      - OFFICE_PORT=8000
      - OFFICE_ROOT=/data
    volumes:
      - office-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512M,mode=1777
    networks:
      - sandbox-net
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Per-node disk write throttle. Swarm has no blkio settings, so this global
  # helper writes the cgroup io.max (v2) / blkio throttle (v1) of every local
  # container labelled io.pulsarteam.io-limit.write-bps (the CLI runners).
  # It needs the host cgroup tree (rw) and the Docker socket (to list local
  # containers); it publishes no port and joins no application network.
  io-limiter:
    build:
      context: .
      dockerfile: io-limiter/Dockerfile
    environment:
      - TZ=${TZ:-Europe/Paris}
      - LOG_LEVEL=INFO
      - IO_LIMITER_INTERVAL=15
    volumes:
      - /sys/fs/cgroup:/host/cgroup
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: none
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

volumes:
  # Rust toolchain, provisioned once per node by runner-service/src/rust_toolchain.sh
  # and shared read-only by every runner of that node (kept out of the image).
  rust-toolchain:
  pgdata:
  # Flutter + Android toolchain, provisioned once per node by
  # runner-service/src/android_toolchain.sh (shared, agent-writable through the
  # toolchain group; replaces the old claudecode-android-cache).
  android-toolchain:
  # CLI runner *-data volumes removed — those runners are stateless now
  # (/app/data re-injected at spawn). sandbox/mock keep their data volumes.
  sandbox-data:
  mock-data:
  # Scratch / uploads volume office-service confines all file ops under (OFFICE_ROOT).
  office-data:

networks:
  internal:
  sandbox-net:
  backend:
  # Shared network so the local-model CLI runners (hermes/opencode/openclaw/
  # aider) can reach a vLLM/Ollama server by name. Compose-managed here so
  # `docker compose up` just works. If your vLLM/Ollama runs in a SEPARATE
  # compose project, make this external and create it once
  # (`docker network create llm-net`), then add the same external `llm-net`
  # to that project's service. The swarm deploy (devops/docker-compose.swarm.yml)
  # already declares it external.
  llm-net:
