services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=swarm_prod
      - POSTGRES_USER=swarm_prod_app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (openssl rand -hex 24)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swarm_prod_app -d swarm_prod']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 48)}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      - DATABASE_CONNECTION_STRING=postgresql://swarm_prod_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (openssl rand -hex 24)}@postgres:5432/swarm_prod
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-}
      - OPENAI_REALTIME_VOICE=${OPENAI_REALTIME_VOICE:-alloy}
      - OPENAI_REALTIME_TRANSCRIBE_MODEL=${OPENAI_REALTIME_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-}
      - GEMINI_LIVE_VOICE=${GEMINI_LIVE_VOICE:-Kore}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      - CODER_API_KEY=${CODER_API_KEY:?CODER_API_KEY must be set in .env (openssl rand -hex 32)}
      - HOME_FORM_KEY=${HOME_FORM_KEY:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-PulsarTeam}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-agent@pulsarteam.local}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_USER=${GITHUB_USER:-}
      # Extra hosts a repo may be cloned from (github.com + https are implicit).
      - GIT_CLONE_ALLOWED_HOSTS=${GIT_CLONE_ALLOWED_HOSTS:-}
      - GITHUB_ENTERPRISE_HOST=${GITHUB_ENTERPRISE_HOST:-}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - SANDBOX_SERVICE_URL=http://sandbox-service:8000
      - CLAUDECODE_SERVICE_URL=http://claudecode-service:8000
      - OPENCLAW_SERVICE_URL=http://openclaw-service:8000
      - HERMES_SERVICE_URL=http://hermes-service:8000
      - OPENCODE_SERVICE_URL=http://opencode-service:8000
      - AIDER_SERVICE_URL=http://aider-service:8000
      - VIBE_SERVICE_URL=http://vibe-service:8000
      - CODEX_SERVICE_URL=http://codex-service:8000
      - BROWSER_SERVICE_URL=http://mcp-browser:8000
      # Solves Cloudflare challenges for the authenticated browser (root URL only).
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - OFFICE_SERVICE_URL=${OFFICE_SERVICE_URL:-http://office-service:8000}
      - MCP_ENDPOINT=${MCP_ENDPOINT:-}
      - MCP_ACTIONS_ENDPOINT=${MCP_ACTIONS_ENDPOINT:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Google OAuth — one client serves login + Gmail + Drive plugins. The
      # redirect_uri is derived from each request (req.protocol + host + a
      # fixed path), so no URI env var is needed.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Microsoft OAuth — one Azure App registration serves login + every
      # Microsoft Graph plugin (OneDrive, Outlook, …). Same auto-derived URI
      # scheme as Google.
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI:-}
      - JIRA_BOARD_URL=${JIRA_BOARD_URL:-}
      - JIRA_ORG_ID=${JIRA_ORG_ID:-}
      - JIRA_API_KEY=${JIRA_API_KEY:-}
      - JIRA_USER_EMAIL=${JIRA_USER_EMAIL:-}
      - JIRA_WEBHOOK_URL=${JIRA_WEBHOOK_URL:-}
      - JIRA_WEBHOOK_SECRET=${JIRA_WEBHOOK_SECRET:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M,mode=1777
    ports:
      - '3001:3001'
    networks:
      - internal
      - sandbox-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      # /api/health answers 503 once the DB has failed twice in a row, so a slow
      # boot must not count toward `retries` — without this the first probe of a
      # cold start marks the task unhealthy and Swarm restarts it in a loop.
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /var/cache/nginx:size=64M,mode=0755
      - /var/run:size=8M,mode=0755
    ports:
      # The image runs nginx unprivileged, so the container listens on 8080.
      - '80:8080'
    networks:
      - internal
    depends_on:
      - api
    restart: unless-stopped

  # ─── Runner services ─────────────────────────────────────────────────────
  # Single image (runner-service/Dockerfile), different RUNNER_TYPE per deployment.
  # Aligned with devops/docker-compose.swarm.yml:
  #   - cap_drop: ALL with minimal cap_add for per-agent UID isolation
  #   - no-new-privileges, /tmp on tmpfs
  #   - no docker socket mount, no host code bind mount
  #   - per-service named volumes only

  claudecode-service:
    # PID 1 reaper (tini). The runner's CLIs daemonise: tmux forks a server that
    # detaches, and the CLI's own children outlive it — all reparented to PID 1.
    # Without an init there, python server.py never wait()s them and the container
    # slowly fills with [tmux: server] / [claude] <defunct> entries.
    init: true
    build:
      context: .
      dockerfile: runner-service/Dockerfile
      args:
        RUNNER_CLI_CACHE_BUST: ${RUNNER_CLI_CACHE_BUST:-2026-09-29}
    environment:
      - RUNNER_TYPE=claude-code
      - TZ=${TZ:-Europe/Paris}
      - LOG_LEVEL=info
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - RUNNER_MODEL=${CLAUDE_MODEL:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - RUNNER_MAX_TURNS=${CLAUDE_MAX_TURNS:-50}
      - CLAUDE_MAX_TURNS=${CLAUDE_MAX_TURNS:-50}
      - VERBOSE=${CODER_VERBOSE:-false}
      - TIMEOUT=600
      - PORT=8000
      - HOST=0.0.0.0
      - CODER_API_KEY=${CODER_API_KEY:?CODER_API_KEY must be set in .env (openssl rand -hex 32)}
      - PUID=${CODER_PUID:-1000}
      - PGID=${CODER_PGID:-1000}
      - SWARM_API_BASE_URL=http://api:3001
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - MCP_ENDPOINT=${MCP_ENDPOINT:-}
      - PYTHONUNBUFFERED=1
      - PYTHONFAULTHANDLER=1
    volumes:
      # Stateless runner: /app/data is NOT persisted — agent HOMEs, OAuth tokens
      # (hydrated from team-api per owner), MCP/settings and project clones are
      # all re-injected at spawn. A global (no-owner) token must come from the
      # CLAUDE_CODE_OAUTH_TOKEN env. Only the per-node toolchain volumes are kept.
      - rust-toolchain:/opt/rust
      - android-toolchain:/opt/android
    # Disk write ceiling, enforced per node by the io-limiter service
    # (Swarm ignores blkio_config): a runner's builds/installs must not
    # starve the disk shared with Postgres and the other services.
    labels:
      - 'io.pulsarteam.io-limit.write-bps=${RUNNER_IO_WRITE_BPS:-25M}'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512M,mode=1777
    ports:
      - '8000:8000'
    networks:
      - sandbox-net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  openclaw-service:
    init: true # reap reparented tmux/CLI children (see claudecode-service)
    build:
