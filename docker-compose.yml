      - PYTHONUNBUFFERED=1
    # Stateless runner — /app/data re-injected at spawn (see claudecode-service).
    volumes:
      - rust-toolchain:/opt/rust
      - android-toolchain:/opt/android
    # Disk write ceiling, enforced per node by the io-limiter service
    # (Swarm ignores blkio_config): a runner's builds/installs must not
    # starve the disk shared with Postgres and the other services.
    labels:
      - 'io.pulsarteam.io-limit.write-bps=${RUNNER_IO_WRITE_BPS:-25M}'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512M,mode=1777
    networks:
      - sandbox-net
      # Reach local LLM servers (vLLM/Ollama) by service name. See the llm-net
      # note in the networks: block at the bottom of this file.
      - llm-net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

