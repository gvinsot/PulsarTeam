      context: .
      dockerfile: runner-service/Dockerfile
      args:
        RUNNER_CLI_CACHE_BUST: ${RUNNER_CLI_CACHE_BUST:-2026-09-29}
        VIBE_CLI_VERSION: ${VIBE_CLI_VERSION:-latest}
        VIBE_CLI_CACHE_BUST: ${VIBE_CLI_CACHE_BUST:-2026-10-19}
    environment:
      - RUNNER_TYPE=vibe
      - TZ=${TZ:-Europe/Paris}
      - LOG_LEVEL=info
      - RUNNER_MODEL=${VIBE_MODEL:-}
      # Fallback key — the per-agent LLM config forwarded via X-LLM-Config
