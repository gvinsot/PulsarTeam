# Main nginx configuration for the frontend image.
#
# Replaces the stock /etc/nginx/nginx.conf so the server can run as the
# unprivileged `nginx` user: every path nginx writes to at runtime (pid file and
# the proxy/body temp directories) is moved under /tmp, which is world-writable
# in the image and tmpfs-mounted by compose. The stock config puts the pid in
# /var/run and the temp dirs in /var/cache/nginx, both root-owned.
#
# The `user` directive is deliberately absent: it only applies when the master
# process starts as root, and nginx warns about it otherwise.

worker_processes auto;

error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable-by-nginx temp paths (see header comment).
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
