# Content-Security-Policy for everything nginx serves from disk (the SPA shell,
# its bundles, public/ files and nginx's own error pages).
#
# Included per static location rather than set at server level, for two reasons:
#   * add_header is inherited only by locations that declare no add_header of
#     their own, so a server-level header disappears silently the day someone
#     adds one to a location;
#   * the proxied /api/ responses must keep the API's own policy — its OAuth
#     result pages carry a per-request script nonce (api/src/routes/oauthHelper.ts),
#     and two CSP headers are enforced as an intersection.
#
# `always` so 404s carry it too. Each directive, and why it is not narrower:
#   script-src  blob:   the voice pipelines load their AudioWorklet from a Blob URL
#                       (lib/externalVoiceClient.ts, lib/voice/gemini.ts); worklet
#                       modules are governed by script-src.
#   style-src   'unsafe-inline'  xterm and mermaid inject <style> elements, and the
#                       sanitized SVG markup keeps style="" attributes. Inline
#                       <script> stays forbidden.
#   img-src     https:  GitHub avatars and images embedded in commit/PR markdown
#                       (GitHubActivityModal) come from arbitrary hosts.
#   connect-src 'self' also matches ws:/wss: on this origin (socket.io, terminal,
#                       voice proxy). Third parties: OpenAI Realtime (WebRTC SDP
#                       exchange), Gemini Live, and the Umami collector.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.openai.com https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://stats.methodinfo.fr; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
