server {
    # 8080, not 80: the image runs nginx as the unprivileged `nginx` user, which
    # cannot bind a privileged port. Compose publishes 80:8080 and the Traefik
    # label targets 8080 — change all three together.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so upstream names are resolved at request time,
    # not at nginx startup. Without this, nginx crashes with
    # "host not found in upstream" if the api service isn't up yet, and never
    # restarts even after it becomes available.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # Proxy API requests to the backend service
    location /api/ {
        set $upstream_api "api:3001";
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.IO (WebSocket + polling) to the backend service
    location /socket.io/ {
        set $upstream_socket "api:3001";
        proxy_pass http://$upstream_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy terminal WebSockets for CLI runners to the backend service
    location /ws/ {
        set $upstream_ws "api:3001";
        proxy_pass http://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
